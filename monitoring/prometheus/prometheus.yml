global:
  scrape_interval: 15s # How frequently to scrape targets
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'tms_backend'
    metrics_path: '/metrics'
    static_configs:
      # host.docker.internal points to your host machine from inside the docker container
      # This allows Prometheus to reach localhost:5000 where your Node.js backend runs
      - targets: ['host.docker.internal:5000']
